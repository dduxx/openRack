BUILDSCAD_PROJECT=openRack
BUILDSCAD_VERSION=0.0.1
BUILDSCAD_AUTHOR=dduxx
BUILDSCAD_ASSEMBLIES=scad/assemblies/rack_studs/bracket.scad,\
    scad/assemblies/rack_studs/nut.scad,\
    scad/assemblies/hdd/sled.scad[SLED_TYPE="default"],\
    scad/assemblies/hdd/sled.scad[SLED_TYPE="2_5_adapter"],\
    scad/assemblies/hdd/jbod.scad[JBOD_RACK_TYPE="NINETEEN_INCH";SECTION="LEFT"],\
    scad/assemblies/hdd/jbod.scad[JBOD_RACK_TYPE="NINETEEN_INCH";SECTION="MIDDLE"],\
    scad/assemblies/hdd/jbod.scad[JBOD_RACK_TYPE="NINETEEN_INCH";SECTION="RIGHT"],\
    scad/assemblies/hdd/jbod.scad[JBOD_RACK_TYPE="TEN_INCH";JBOD_SECTIONS=2;SECTION="LEFT"],\
    scad/assemblies/hdd/jbod.scad[JBOD_RACK_TYPE="TEN_INCH";JBOD_SECTIONS=2;SECTION="RIGHT"]
BUILDSCAD_LOG_LEVEL=INFO
BUILDSCAD_OPENSCAD_PATH=openscad-nightly
BUILDSCAD_OUTPUT_FORMAT=stl,png,3mf
BUILDSCAD_OPENSCAD_COLORSCHEME=DeepOcean
BUILDSCAD_IMAGESIZE=1280,720
